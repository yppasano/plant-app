<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Cycle Monitor Cloud</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#111827">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* ダークモード・スタイル調整 */
    body { background-color: #111827; color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
    .guide-frame {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 80%; height: 200px; border: 3px dashed #2dd4bf; border-radius: 12px; pointer-events: none;
      background: rgba(45, 212, 191, 0.1);
    }
    .fab {
      position: fixed; right: 20px; bottom: 90px; width: 64px; height: 64px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 32px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5); z-index: 40; transition: transform 0.2s;
    }
    .fab:active { transform: scale(0.95); }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
      z-index: 60; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .action-sheet {
      position: fixed; bottom: 0; left: 0; right: 0; background: #1f2937;
      border-radius: 20px 20px 0 0; z-index: 50; animation: slideUp 0.3s ease-out;
      border-top: 1px solid #374151; padding-bottom: env(safe-area-inset-bottom);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
    .accordion-content.expanded { max-height: 1000px; transition: max-height 0.5s ease-in; }
    .arrow-icon.rotated { transform: rotate(180deg); }
    .loader { border: 3px solid #374151; border-top: 3px solid #2dd4bf; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .bottom-nav { background: rgba(17, 24, 39, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid #374151; }
    .search-sheet { transform: translateY(100%); transition: transform 0.3s ease-out; }
    .search-sheet.open { transform: translateY(0); }
  </style>
</head>
<body class="pb-32 antialiased selection:bg-teal-500 selection:text-white">

  <div id="authScreen" class="fixed inset-0 z-[100] bg-gray-900 flex flex-col items-center justify-center p-6 transition-opacity duration-500">
    <div class="w-full max-w-sm space-y-8">
      <div class="text-center">
        <span class="text-6xl">🌿</span>
        <h2 class="mt-4 text-3xl font-bold text-white tracking-tight">Cycle Monitor</h2>
        <p class="mt-2 text-sm text-gray-400">Cloud Edition</p>
      </div>
      <form id="authForm" class="space-y-4 bg-gray-800 p-8 rounded-2xl border border-gray-700 shadow-xl" onsubmit="event.preventDefault(); document.getElementById('signInBtn').click();">
        <div>
          <label class="block text-xs font-medium text-gray-400 uppercase" for="emailInput">Email</label>
          <input id="emailInput" type="email" class="mt-1 block w-full px-3 py-3 bg-gray-900 border border-gray-600 rounded-lg text-white focus:ring-teal-500 focus:border-teal-500 outline-none" placeholder="you@example.com" autocomplete="email">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 uppercase" for="passwordInput">Password</label>
          <input id="passwordInput" type="password" class="mt-1 block w-full px-3 py-3 bg-gray-900 border border-gray-600 rounded-lg text-white focus:ring-teal-500 focus:border-teal-500 outline-none" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div id="authError" class="text-red-400 text-xs text-center hidden"></div>
        <button id="signInBtn" type="button" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-bold py-3 rounded-lg shadow-lg transition transform active:scale-95">
          Sign In / Sign Up
        </button>
        <p class="text-xs text-gray-500 text-center mt-2">※ 初回は自動でアカウント作成を試みます</p>
      </form>
    </div>
  </div>

  <div id="appScreen" class="hidden opacity-0 transition-opacity duration-500 flex flex-col min-h-screen relative">
    
    <!-- スクロール領域（タイトル＋リスト） -->
    <div class="flex-1 overflow-y-auto">
      <header class="pt-6 pb-2 px-4">
        <div class="flex justify-between items-end">
          <div>
            <h1 class="text-3xl font-bold tracking-tight text-white">Cycle Monitor</h1>
            <div id="syncStatus" class="flex items-center gap-2 text-xs text-teal-400/80 mt-1">
              <span class="w-2 h-2 rounded-full bg-teal-500" id="syncDot"></span>
              <span id="syncText">Offline</span>
            </div>
          </div>
          <select id="sortSelect" class="bg-gray-800 border border-gray-700 text-teal-400 text-xs font-bold rounded-lg py-2 px-3 outline-none mb-1">
            <option value="created">▼ Newest</option>
            <option value="id">🔤 ID (A-Z)</option>
            <option value="alert">⚠️ Alert</option>
            <option value="dry_slow">🐢 Slow Dry</option>
            <option value="dry_fast">🐇 Fast Dry</option>
          </select>
        </div>
      </header>
      <main id="plantList" class="p-4 space-y-4 pb-24">
        <div class="text-center py-10"><div class="loader mx-auto"></div><p class="text-gray-500 text-sm mt-2">Loading data...</p></div>
      </main>
    </div>

    <!-- 下固定メニュー -->
    <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 bottom-nav pt-2 px-2 z-30 flex justify-around items-center" style="padding-bottom: max(1rem, env(safe-area-inset-bottom));">
      <button id="navCameraBtn" class="flex flex-col items-center p-2 text-gray-400 hover:text-teal-400 transition active:scale-95">
        <span class="text-2xl mb-1">📷</span>
        <span class="text-[10px] font-semibold">Scan Tag</span>
      </button>
      <button id="navManualBtn" class="flex flex-col items-center p-2 text-gray-400 hover:text-teal-400 transition active:scale-95">
        <span class="text-2xl mb-1">⌨️</span>
        <span class="text-[10px] font-semibold">Manual</span>
      </button>
      <button id="navSearchBtn" class="flex flex-col items-center p-2 text-gray-400 hover:text-teal-400 transition active:scale-95">
        <span class="text-2xl mb-1">🔍</span>
        <span class="text-[10px] font-semibold">Search</span>
      </button>
      <button id="navSettingsBtn" class="flex flex-col items-center p-2 text-gray-400 hover:text-teal-400 transition active:scale-95">
        <span class="text-2xl mb-1">⚙️</span>
        <span class="text-[10px] font-semibold">Settings</span>
      </button>
    </nav>
  </div>

  <!-- 検索ボトムシート -->
  <div id="searchSheetOverlay" class="fixed inset-0 bg-black/60 z-40 hidden" onclick="closeSearchSheet()"></div>
  <div id="searchSheet" class="fixed bottom-0 left-0 right-0 search-sheet bg-gray-800 border-t border-gray-700 rounded-t-2xl p-6 pb-10 z-50">
    <div class="w-12 h-1.5 bg-gray-600 rounded-full mx-auto mb-6"></div>
    <h3 class="text-lg font-bold text-gray-100 mb-4 px-2">ID 検索</h3>
    <div class="relative">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">🔍</span>
      <input type="text" id="searchInput" placeholder="ID search..." class="w-full pl-10 p-3 bg-gray-900 border border-gray-700 rounded-xl text-gray-200 placeholder-gray-600 focus:outline-none focus:border-teal-500 transition" />
    </div>
  </div>

  <div id="manualInputModal" class="hidden modal-overlay" onclick="closeManualModal(event)">
    <div class="bg-gray-800 rounded-2xl p-6 w-full max-w-sm border border-gray-700 shadow-2xl" onclick="event.stopPropagation()">
      <h3 class="text-xl font-bold text-gray-100 mb-4">Enter ID</h3>
      <input type="text" id="manualIdInput" class="w-full p-4 bg-gray-900 border border-gray-600 rounded-xl mb-6 text-lg text-white focus:outline-none focus:border-teal-500" placeholder="e.g. A-01" />
      <div class="flex gap-3">
        <button onclick="closeManualModal()" class="flex-1 bg-gray-700 text-gray-300 font-bold py-3 rounded-xl">Cancel</button>
        <button id="manualSubmitBtn" class="flex-1 bg-teal-600 text-white font-bold py-3 rounded-xl shadow-lg">Add</button>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="hidden modal-overlay" onclick="closeSettingsModal(event)">
    <div class="bg-gray-800 rounded-2xl p-6 w-full max-w-sm border border-gray-700 shadow-2xl" onclick="event.stopPropagation()">
      <h3 class="text-xl font-bold text-gray-100 mb-6">Settings</h3>
      <div class="space-y-3">
        <div class="text-xs text-gray-500 text-center mb-2" id="userEmailDisplay"></div>
        <button id="importBtn" class="w-full bg-blue-900/40 text-blue-200 border border-blue-800 font-bold py-3 rounded-xl flex items-center justify-center gap-2">
          📤 バックアップから取り込み (Import)
        </button>
        <button id="exportBtn" class="w-full bg-gray-700/40 text-gray-200 border border-gray-600 font-bold py-3 rounded-xl flex items-center justify-center gap-2">
          📥 バックアップを保存 (Export)
        </button>
        <p class="text-[10px] text-gray-500 px-2">※ 携帯のLocalStorageバックアップJSONを選択してクラウドに移行できます</p>
        <button id="logoutBtn" class="w-full bg-gray-700 text-gray-300 border border-gray-600 font-bold py-3 rounded-xl mt-4">Log Out</button>
      </div>
      <button onclick="closeSettingsModal()" class="w-full mt-6 bg-gray-900 text-gray-500 font-bold py-3 rounded-xl border border-gray-700">Close</button>
    </div>
  </div>

  <div id="scanOverlay" class="fixed inset-0 bg-black z-50 hidden">
    <video id="video" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video>
    <canvas id="canvas" class="hidden"></canvas>
    <div class="guide-frame"><div class="guide-text bg-teal-700 text-white px-4 py-2 rounded-lg font-bold absolute -top-10 left-1/2 -translate-x-1/2 whitespace-nowrap">Scan Tag</div></div>
    <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black via-black/80 to-transparent p-6 pt-20 flex flex-col gap-4">
      <div id="scanStatus" class="text-center text-white font-bold bg-black/60 py-2 rounded-full border border-white/20">Camera Active</div>
      <div class="flex gap-4">
        <button id="closeScanBtn" class="flex-1 bg-gray-700 text-white py-4 rounded-xl font-bold">Close</button>
        <button id="captureBtn" class="flex-1 bg-teal-600 text-white py-4 rounded-xl font-bold shadow-lg">Capture</button>
      </div>
      <div class="h-6"></div>
    </div>
  </div>

  <input type="file" id="imageFileInput" accept="image/*" class="hidden" />
  <input type="file" id="importFileInput" accept=".json,application/json" class="hidden" />

  <script type="module" src="./src/app.js"></script>
</body>
</html>
