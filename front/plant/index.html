<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Ageta</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    /* ログイン前は従来のダークガラス。メイン（#appScreen）は下で白ベース */
    body { background: #f3f4f6; color: #111827; }
    .bg-overlay { position: fixed; inset: 0; background: transparent; z-index: 0; pointer-events: none; }
    .glass { background: rgba(20, 30, 25, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: rgba(30, 41, 35, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .glass-card-alert { background: rgba(45, 20, 25, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(244, 63, 94, 0.25); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .glass-card-water { background: rgba(15, 35, 45, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(6, 182, 212, 0.4); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3), 0 0 20px 0 rgba(6, 182, 212, 0.2); }
    /* --- リスト画面（sample02 系: 白・黒テキスト） --- */
    #appScreen {
      background: #ffffff;
      color: #111827;
    }
    #appScreen .glass-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    #appScreen .glass-card:hover { border-color: #d1d5db; }
    #appScreen .glass-card-alert {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      box-shadow: 0 4px 20px rgba(244, 63, 94, 0.08);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    #appScreen .glass-card-water {
      background: #ecfeff;
      border: 1px solid #a5f3fc;
      box-shadow: 0 4px 20px rgba(6, 182, 212, 0.12);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    #appScreen .loader {
      border: 3px solid #e5e7eb;
      border-top: 3px solid #111827;
    }
    .guide-frame {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 80%; height: 200px; border: 3px dashed #2dd4bf; border-radius: 12px; pointer-events: none;
      background: rgba(45, 212, 191, 0.1);
    }
    .fab {
      position: fixed; right: 20px; bottom: 90px; width: 64px; height: 64px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 32px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5); z-index: 40; transition: transform 0.2s;
    }
    .fab:active { transform: scale(0.95); }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
      z-index: 60; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .action-sheet {
      position: fixed; bottom: 0; left: 0; right: 0; background: #1f2937;
      border-radius: 20px 20px 0 0; z-index: 50; animation: slideUp 0.3s ease-out;
      border-top: 1px solid #374151; padding-bottom: env(safe-area-inset-bottom);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease; opacity: 0; }
    .accordion-content.expanded { max-height: 800px; opacity: 1; }
    .arrow-icon.rotated { transform: rotate(180deg); }
    .loader { border: 3px solid #374151; border-top: 3px solid #2dd4bf; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .bottom-nav {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid #e5e7eb;
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.06);
    }
    .search-sheet { transform: translateY(100%); transition: transform 0.3s ease-out; }
    .search-sheet.open { transform: translateY(0); }
    /* 詳細画面（リストから切り替え） */
    #detailScreen { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    /* 検索シート（リストのナビから） */
    #searchSheet {
      background: #ffffff !important;
      border-top: 1px solid #e5e7eb;
      color: #111827;
      border-left: none;
      border-right: none;
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-gray-300 selection:text-black relative">
  <div class="bg-overlay"></div>

  <div id="authScreen" class="fixed inset-0 z-[100] glass flex flex-col items-center justify-center p-8 transition-opacity duration-500">
    <div class="glass-card p-8 rounded-3xl w-full max-w-sm text-center relative z-10">
      <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg border border-emerald-500/30">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-10 h-10"><path d="M12 2 C 22 6 22 16 12 20 C 2 16 2 6 12 2 Z" /><polyline points="12 2 12 9 6 12 16 15 12 17 12 23" /></svg>
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight">Ageta</h2>
      <p class="text-emerald-400/80 text-sm mb-8">botanical companion</p>
      <form id="authForm" class="space-y-4 text-left" onsubmit="event.preventDefault(); document.getElementById('signInBtn').click();">
        <div class="relative">
          <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
          <input id="emailInput" type="email" class="w-full bg-black/30 border border-white/10 rounded-2xl py-3 pl-12 pr-4 text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500/50" placeholder="Email address" autocomplete="email">
        </div>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
          <input id="passwordInput" type="password" class="w-full bg-black/30 border border-white/10 rounded-2xl py-3 pl-12 pr-4 text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500/50" placeholder="Password" autocomplete="current-password">
        </div>
        <div id="authError" class="text-red-400 text-xs hidden"></div>
        <button id="signInBtn" type="button" class="w-full bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-semibold py-3.5 rounded-2xl shadow-lg shadow-emerald-900/50 transition-all active:scale-95">
          Sign In / Sign Up
        </button>
        <p class="text-xs text-gray-500 text-center mt-2">※ 初回は自動でアカウント作成を試みます</p>
      </form>
    </div>
  </div>

  <div id="appScreen" class="hidden opacity-0 transition-opacity duration-500 flex flex-col min-h-screen relative z-10 max-w-md mx-auto w-full">
    
    <!-- スクロール領域（タイトル＋リスト） -->
    <div id="scrollContainer" class="flex-1 overflow-y-auto">
      <header class="pt-6 pb-2 px-4">
        <div class="flex justify-between items-end">
          <div>
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">Ageta</h1>
            <div id="syncStatus" class="flex items-center gap-2 text-xs text-gray-500 mt-1">
              <span class="w-2 h-2 rounded-full bg-emerald-500" id="syncDot"></span>
              <span id="syncText">Offline</span>
            </div>
          </div>
          <div class="relative mb-1">
            <select id="sortSelect" class="bg-white border-2 border-gray-900 text-gray-900 text-xs font-bold rounded-xl py-2 pl-3 pr-8 appearance-none focus:outline-none focus:ring-2 focus:ring-gray-400 cursor-pointer shadow-sm">
            <option value="id" selected>🔤 Name (ID順)</option>
            <option value="created">▼ Newest</option>
            <option value="alert">⚠️ Alert</option>
            <option value="dry_slow">🐢 Slow Dry</option>
            <option value="dry_fast">🐇 Fast Dry</option>
            </select>
            <i data-lucide="chevron-down" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-900 pointer-events-none"></i>
          </div>
        </div>
      </header>
      <main id="plantList" class="p-4 space-y-4 pb-24">
        <div class="text-center py-10"><div class="loader mx-auto"></div><p class="text-gray-600 text-sm mt-2">Loading data...</p></div>
      </main>
    </div>

    <!-- 下固定メニュー -->
    <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 bottom-nav rounded-t-3xl pt-2 px-2 z-30 flex justify-around items-center text-gray-900" style="padding-bottom: max(1rem, env(safe-area-inset-bottom));">
      <button id="navCameraBtn" class="flex flex-col items-center p-2 text-gray-600 hover:text-gray-900 transition group active:scale-95">
        <div class="p-1.5 rounded-xl group-hover:bg-gray-100 transition mb-1"><i data-lucide="camera" class="w-6 h-6"></i></div>
        <span class="text-[10px] font-semibold tracking-wide">Scan Tag</span>
      </button>
      <button id="navManualBtn" class="flex flex-col items-center p-2 text-gray-600 hover:text-gray-900 transition group active:scale-95">
        <div class="p-1.5 rounded-xl group-hover:bg-gray-100 transition mb-1"><i data-lucide="edit-3" class="w-6 h-6"></i></div>
        <span class="text-[10px] font-semibold tracking-wide">Manual</span>
      </button>
      <button id="navSearchBtn" class="flex flex-col items-center p-2 text-gray-600 hover:text-gray-900 transition group active:scale-95">
        <div class="p-1.5 rounded-xl group-hover:bg-gray-100 transition mb-1"><i data-lucide="search" class="w-6 h-6"></i></div>
        <span class="text-[10px] font-semibold tracking-wide">Search</span>
      </button>
      <button id="navSettingsBtn" class="flex flex-col items-center p-2 text-gray-600 hover:text-gray-900 transition group active:scale-95">
        <div class="p-1.5 rounded-xl group-hover:bg-gray-100 transition mb-1"><i data-lucide="settings" class="w-6 h-6"></i></div>
        <span class="text-[10px] font-semibold tracking-wide">Settings</span>
      </button>
    </nav>
  </div>

  <!-- 植物詳細（アコーディオン廃止・全画面） -->
  <div id="detailScreen" class="fixed inset-0 z-[48] flex flex-col bg-gray-950/98 backdrop-blur-md hidden overflow-hidden" style="transform: translateX(100%);">
    <header class="shrink-0 flex items-center gap-3 p-4 pt-[max(1rem,env(safe-area-inset-top))] border-b border-white/10">
      <button type="button" onclick="closeDetail()" class="p-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-white transition active:scale-95" aria-label="戻る">
        <i data-lucide="chevron-left" class="w-6 h-6"></i>
      </button>
      <div class="min-w-0 flex-1">
        <h2 id="detailPlantName" class="text-lg font-bold text-white truncate leading-tight">—</h2>
        <p id="detailPlantMeta" class="text-xs text-gray-400 truncate mt-0.5"><span id="detailPlantIdBadge" class="font-mono text-emerald-400/90"></span><span id="detailPlantSubtitle" class=""></span></p>
      </div>
    </header>
    <div id="detailScroll" class="flex-1 overflow-y-auto overscroll-contain pb-8">
      <div id="detailImageWrap" onclick="openImageUploadFromDetail()" class="relative mx-4 mt-4 aspect-[4/3] max-h-64 rounded-2xl overflow-hidden border border-white/10 bg-black/40 cursor-pointer group">
        <div id="detailImagePlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 text-sm gap-2 hidden">
          <i data-lucide="image" class="w-10 h-10 opacity-40"></i>
          <span>写真を追加</span>
        </div>
        <img id="detailImage" src="" alt="" class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition" />
        <div class="absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 group-hover:opacity-100 transition pointer-events-none">
          <span class="text-white text-sm font-semibold flex items-center gap-2"><i data-lucide="camera" class="w-5 h-5"></i> 写真を変更</span>
        </div>
      </div>
      <div class="px-4 mt-6">
        <div class="flex justify-between items-end text-[10px] font-semibold text-gray-500 uppercase tracking-wider px-1 mb-2 border-b border-white/10 pb-2">
          <span>History</span>
          <span id="detailAvgLabel" class="text-emerald-400/90">Avg: —</span>
        </div>
        <div id="detailHistoryList" class="space-y-0 max-h-48 overflow-y-auto"></div>
      </div>
      <div class="px-4 mt-6 grid grid-cols-3 gap-3">
        <button type="button" onclick="confirmAndAddLogFromDetail('液肥')" class="bg-gradient-to-b from-emerald-500/20 to-emerald-600/5 border border-emerald-500/50 text-emerald-300 py-3 rounded-xl text-xs font-bold hover:from-emerald-500/30 transition flex flex-col items-center gap-1.5 active:scale-95">
          <i data-lucide="flask-conical" class="w-5 h-5"></i> 液肥
        </button>
        <button type="button" onclick="confirmAndAddLogFromDetail('水')" class="bg-gradient-to-b from-cyan-500/20 to-cyan-600/5 border border-cyan-500/50 text-cyan-300 py-3 rounded-xl text-xs font-bold hover:from-cyan-500/30 transition flex flex-col items-center gap-1.5 active:scale-95">
          <i data-lucide="droplets" class="w-5 h-5"></i> 水
        </button>
        <button type="button" onclick="confirmAndAddLogFromDetail('活力剤')" class="bg-gradient-to-b from-amber-500/20 to-amber-600/5 border border-amber-500/50 text-amber-300 py-3 rounded-xl text-xs font-bold hover:from-amber-500/30 transition flex flex-col items-center gap-1.5 active:scale-95">
          <i data-lucide="sparkles" class="w-5 h-5"></i> 活力剤
        </button>
      </div>
      <div class="px-4 mt-8 flex flex-wrap gap-3 justify-end border-t border-white/5 pt-6">
        <button type="button" onclick="openRenameModalFromDetail()" class="text-xs text-gray-400 hover:text-emerald-400 transition flex items-center gap-1 px-2 py-1">
          <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> 名前・IDを変更
        </button>
        <button type="button" onclick="openStatusPopoverFromDetail()" class="text-xs text-gray-400 hover:text-emerald-400 transition flex items-center gap-1 px-2 py-1">
          <i data-lucide="clipboard-list" class="w-3.5 h-3.5"></i> Status
        </button>
        <button type="button" onclick="deletePlantFromDetail()" class="text-xs text-gray-400 hover:text-red-400 transition flex items-center gap-1 px-2 py-1">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete
        </button>
      </div>
    </div>
  </div>

  <!-- 検索ボトムシート -->
  <div id="searchSheetOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden" onclick="closeSearchSheet()"></div>
  <div id="searchSheet" class="fixed bottom-0 left-0 right-0 search-sheet rounded-t-3xl p-6 pb-10 z-50 shadow-[0_-8px_32px_rgba(0,0,0,0.08)]">
    <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-6"></div>
    <h3 class="text-lg font-bold text-gray-900 mb-4 px-2">ID 検索</h3>
    <div class="relative">
      <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
      <input type="text" id="searchInput" placeholder="Search plants..." class="w-full pl-12 pr-4 py-3.5 bg-gray-50 border-2 border-gray-200 rounded-2xl text-gray-900 placeholder-gray-400 focus:outline-none focus:border-gray-900 transition" />
    </div>
  </div>

  <div id="manualInputModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex justify-center items-center p-4" onclick="closeManualModal(event)">
    <div class="glass-card p-6 rounded-3xl w-full max-w-sm" onclick="event.stopPropagation()">
      <h3 class="text-xl font-bold text-gray-100 mb-4">Plant Name</h3>
      <input type="text" id="manualIdInput" placeholder="e.g. Monstera" class="w-full bg-black/30 border border-white/10 rounded-xl py-3 px-4 text-white mb-6 focus:outline-none focus:border-emerald-500/50" />
      <div class="flex gap-3">
        <button onclick="closeManualModal()" class="flex-1 py-3 rounded-xl bg-white/5 hover:bg-white/10 transition font-semibold text-gray-300">Cancel</button>
        <button id="manualSubmitBtn" class="flex-1 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 transition font-semibold text-white shadow-lg shadow-emerald-900/50">Add</button>
      </div>
    </div>
  </div>

  <!-- Status ポップオーバー（明日水やり・状態記録） -->
  <div id="statusPopoverOverlay" class="hidden fixed inset-0 z-50" onclick="closeStatusPopover()"></div>
  <div id="statusPopover" class="hidden fixed z-[60] glass rounded-xl border border-white/10 shadow-2xl py-2 min-w-[200px]">
    <button id="statusWaterMarkerBtn" class="w-full flex items-center gap-2 px-4 py-3 text-left text-gray-200 hover:bg-white/10 transition text-sm">
      <span>💧</span> 明日水やり(マーカー)
    </button>
    <button id="statusRecordBtn" class="w-full flex items-center gap-2 px-4 py-3 text-left text-gray-200 hover:bg-white/10 transition text-sm">
      <span>📝</span> 状態を記録する
    </button>
  </div>

  <!-- 状態記録モーダル -->
  <div id="conditionModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex justify-center items-center p-4" onclick="closeConditionModal(event)">
    <div class="glass-card p-6 rounded-3xl w-full max-w-sm" onclick="event.stopPropagation()">
      <h3 class="text-xl font-bold text-gray-100 mb-4">状態を記録</h3>
      <div id="conditionStep1" class="space-y-3">
        <p class="text-sm text-gray-400 mb-4">Step 1: 状態を選択</p>
        <div class="grid grid-cols-1 gap-2">
          <button data-condition="Good" class="condition-btn w-full py-3 px-4 rounded-xl border-2 border-emerald-500/50 bg-emerald-500/10 text-emerald-300 font-semibold hover:bg-emerald-500/20 hover:border-emerald-500 transition active:scale-95">😄 Good</button>
          <button data-condition="Normal" class="condition-btn w-full py-3 px-4 rounded-xl border-2 border-gray-500/50 bg-gray-500/10 text-gray-300 font-semibold hover:bg-gray-500/20 hover:border-gray-500 transition active:scale-95">😐 Normal</button>
          <button data-condition="Bad" class="condition-btn w-full py-3 px-4 rounded-xl border-2 border-rose-500/50 bg-rose-500/10 text-rose-300 font-semibold hover:bg-rose-500/20 hover:border-rose-500 transition active:scale-95">😢 Bad</button>
        </div>
      </div>
      <div id="conditionStep2" class="hidden space-y-3">
        <p class="text-sm text-gray-400 mb-2">Step 2: 詳細（複数選択可）</p>
        <div id="conditionTags" class="flex flex-wrap gap-2 mb-4"></div>
        <p class="text-[10px] text-gray-500 mb-2">※ 複数選択可能です</p>
      </div>
      <div class="flex gap-3 mt-6">
        <button id="conditionBackBtn" class="hidden flex-1 py-3 rounded-xl bg-white/5 hover:bg-white/10 transition font-semibold text-gray-300">戻る</button>
        <button id="conditionCancelBtn" class="flex-1 py-3 rounded-xl bg-white/5 hover:bg-white/10 transition font-semibold text-gray-300">Cancel</button>
        <button id="conditionSaveBtn" class="flex-1 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 transition font-semibold text-white shadow-lg shadow-emerald-900/50">保存</button>
      </div>
    </div>
  </div>

  <div id="renameModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] flex justify-center items-center p-4" onclick="closeRenameModal(event)">
    <div class="glass-card p-6 rounded-3xl w-full max-w-sm" onclick="event.stopPropagation()">
      <h3 class="text-xl font-bold text-gray-100 mb-4 flex items-center gap-2"><i data-lucide="edit-3" class="w-5 h-5 text-gray-400"></i> 情報を変更</h3>
      <input type="hidden" id="renameTargetId" />
      <div class="space-y-4 mb-6 text-left">
        <div>
          <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider block mb-1.5">名前</label>
          <input type="text" id="renameNameInput" placeholder="表示名" class="w-full bg-black/30 border border-white/10 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-emerald-500/50" />
        </div>
        <div>
          <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider block mb-1.5">ID</label>
          <input type="text" id="renameIdInput" autocomplete="off" placeholder="タグID" class="w-full bg-black/30 border border-white/10 rounded-xl py-3 px-4 text-white font-mono text-sm focus:outline-none focus:border-emerald-500/50" />
        </div>
        <div>
          <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider block mb-1.5">サブタイトル</label>
          <input type="text" id="renameSubtitleInput" placeholder="置き場所など" class="w-full bg-black/30 border border-white/10 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-emerald-500/50" />
        </div>
      </div>
      <div class="flex gap-3">
        <button type="button" onclick="closeRenameModal()" class="flex-1 py-3 rounded-xl bg-white/5 hover:bg-white/10 transition font-semibold text-gray-300">Cancel</button>
        <button type="button" id="renameSubmitBtn" class="flex-1 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 transition font-semibold text-white shadow-lg shadow-emerald-900/50">Save</button>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex justify-center items-center p-4" onclick="closeSettingsModal(event)">
    <div class="glass-card w-full max-w-sm rounded-3xl overflow-hidden" onclick="event.stopPropagation()">
      <div class="p-6 border-b border-white/10">
        <h3 class="text-xl font-bold flex items-center gap-2 text-gray-100"><i data-lucide="settings" class="w-5 h-5 text-gray-400"></i> Settings</h3>
        <div class="text-xs text-gray-500 mt-2" id="userEmailDisplay"></div>
      </div>
      <div class="p-2">
        <button id="importBtn" class="w-full flex items-center gap-3 p-4 hover:bg-white/5 transition text-left text-gray-300 rounded-xl">
          <i data-lucide="download-cloud" class="w-5 h-5 text-emerald-400"></i>
          <div><p class="font-semibold">Restore Data</p><p class="text-xs text-gray-500">Import from JSON backup</p></div>
        </button>
        <button id="exportBtn" class="w-full flex items-center gap-3 p-4 hover:bg-white/5 transition text-left text-gray-300 rounded-xl">
          <i data-lucide="upload-cloud" class="w-5 h-5 text-emerald-400"></i>
          <div><p class="font-semibold">Export Backup</p><p class="text-xs text-gray-500">Save to JSON file</p></div>
        </button>
        <button id="logoutBtn" class="w-full flex items-center gap-3 p-4 hover:bg-white/5 transition text-left text-red-400 mt-2 border-t border-white/5 rounded-xl">
          <i data-lucide="log-out" class="w-5 h-5"></i>
          <span class="font-semibold">Sign Out</span>
        </button>
        <a href="./analytics.html" class="w-full flex items-center gap-3 p-4 hover:bg-white/5 transition text-left text-emerald-400 rounded-xl border-t border-white/5">
          <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
          <div><p class="font-semibold">解析ダッシュボード</p><p class="text-xs text-gray-500">データ分析画面へ</p></div>
        </a>
      </div>
      <div class="p-4 border-t border-white/5">
        <button onclick="closeSettingsModal()" class="w-full py-3 rounded-xl bg-white/5 hover:bg-white/10 transition font-semibold text-gray-500">Close</button>
      </div>
    </div>
  </div>

  <div id="scanOverlay" class="fixed inset-0 bg-black z-50 hidden">
    <video id="video" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video>
    <canvas id="canvas" class="hidden"></canvas>
    <div class="guide-frame"><div class="guide-text bg-teal-700 text-white px-4 py-2 rounded-lg font-bold absolute -top-10 left-1/2 -translate-x-1/2 whitespace-nowrap">Scan Tag</div></div>
    <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black via-black/80 to-transparent p-6 pt-20 flex flex-col gap-4">
      <div id="scanStatus" class="text-center text-white font-bold bg-black/60 py-2 rounded-full border border-white/20">Camera Active</div>
      <div class="flex gap-4">
        <button id="closeScanBtn" class="flex-1 bg-gray-700 text-white py-4 rounded-xl font-bold">Close</button>
        <button id="captureBtn" class="flex-1 bg-teal-600 text-white py-4 rounded-xl font-bold shadow-lg">Capture</button>
      </div>
      <div class="h-6"></div>
    </div>
  </div>

  <input type="file" id="imageFileInput" accept="image/*" class="hidden" />
  <input type="file" id="importFileInput" accept=".json,application/json" class="hidden" />

  <script type="module" src="./src/app.js"></script>
</body>
</html>
