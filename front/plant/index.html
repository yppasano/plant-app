  <style>
    /* ダークモード・スタイル調整 */
    body { background-color: #111827; color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
    .guide-frame {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 80%; height: 200px; border: 3px dashed #2dd4bf; border-radius: 12px; pointer-events: none;
      background: rgba(45, 212, 191, 0.1);
    }
    .fab {
      position: fixed; right: 20px; bottom: 90px; width: 64px; height: 64px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 32px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5); z-index: 40; transition: transform 0.2s;
    }
    .fab:active { transform: scale(0.95); }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
      z-index: 60; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .action-sheet {
      position: fixed; bottom: 0; left: 0; right: 0; background: #1f2937;
      border-radius: 20px 20px 0 0; z-index: 50; animation: slideUp 0.3s ease-out;
      border-top: 1px solid #374151; padding-bottom: env(safe-area-inset-bottom);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
    .accordion-content.expanded { max-height: 1000px; transition: max-height 0.5s ease-in; }
    .arrow-icon.rotated { transform: rotate(180deg); }
    .loader { border: 3px solid #374151; border-top: 3px solid #2dd4bf; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="pb-32 antialiased selection:bg-teal-500 selection:text-white">

  <script>

  <div id="authScreen" class="fixed inset-0 z-[100] bg-gray-900 flex flex-col items-center justify-center p-6 transition-opacity duration-500">

  <script>
    // ========================================
    // 初期化 (Supabase)
    // ========================================
    // 接続クライアントの作成
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    // 状態管理
    let plants = [];
    let currentUser = null;
    let cameraStream = null;
    let searchQuery = '';
    let currentImageTargetPlantId = null;

    // DOM要素
    const els = {
      authScreen: document.getElementById('authScreen'),
      appScreen: document.getElementById('appScreen'),
      emailInput: document.getElementById('emailInput'),
      passwordInput: document.getElementById('passwordInput'),
      signInBtn: document.getElementById('signInBtn'),
      authError: document.getElementById('authError'),
      plantList: document.getElementById('plantList'),
      syncDot: document.getElementById('syncDot'),
      syncText: document.getElementById('syncText'),
      userEmailDisplay: document.getElementById('userEmailDisplay'),
      // 他
      fabBtn: document.getElementById('fabBtn'),
      actionSheet: document.getElementById('actionSheet'),
      actionSheetOverlay: document.getElementById('actionSheetOverlay'),
      manualInputModal: document.getElementById('manualInputModal'),
      manualIdInput: document.getElementById('manualIdInput'),
      settingsModal: document.getElementById('settingsModal'),
      searchInput: document.getElementById('searchInput'),
      sortSelect: document.getElementById('sortSelect'),
      video: document.getElementById('video'),
      canvas: document.getElementById('canvas'),
      scanOverlay: document.getElementById('scanOverlay'),
      scanStatus: document.getElementById('scanStatus'),
      imageFileInput: document.getElementById('imageFileInput'),
      importFileInput: document.getElementById('importFileInput')
    };

    // ========================================
    // 認証フロー
    // ========================================
    const checkUser = async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        currentUser = session.user;
        showApp();
      } else {
        showAuth();
      }
    };

    els.signInBtn.addEventListener('click', async () => {
      const email = els.emailInput.value;
      const password = els.passwordInput.value;
      els.authError.classList.add('hidden');
      els.signInBtn.disabled = true;
      els.signInBtn.textContent = "Processing...";

      // まずログイン試行
      let { data, error } = await supabase.auth.signInWithPassword({ email, password });
      
      if (error) {
        // 失敗したらサインアップ試行 (簡易フロー)
        const { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email, password });
        if (signUpError) {
          els.authError.textContent = "Error: " + signUpError.message;
          els.authError.classList.remove('hidden');
          els.signInBtn.disabled = false;
          els.signInBtn.textContent = "Sign In / Sign Up";
        } else {
          alert("アカウントを作成しました！ログインされました。");
          currentUser = signUpData.user;
          showApp();
        }
      } else {
        currentUser = data.user;
        showApp();
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      location.reload();
    });

    const showAuth = () => {
      els.authScreen.classList.remove('hidden');
      els.appScreen.classList.add('hidden');
    };
    const showApp = () => {
      els.authScreen.classList.add('hidden');
      els.authScreen.style.opacity = 0;
      els.appScreen.classList.remove('hidden');
      setTimeout(() => els.appScreen.style.opacity = 1, 50);
      
      els.userEmailDisplay.textContent = currentUser.email;
      updateSyncStatus('online');
      fetchPlants(); // データ取得開始
    };

    // ========================================
    // データ操作 (Supabase)
    // ========================================
    const updateSyncStatus = (status) => {
      if(status === 'loading') {
        els.syncDot.className = "w-2 h-2 rounded-full bg-yellow-400 animate-pulse mr-1";
        els.syncText.textContent = "Syncing...";
      } else if (status === 'online') {
        els.syncDot.className = "w-2 h-2 rounded-full bg-teal-500 mr-1";
        els.syncText.textContent = "Online";
      }
    };

    // データ取得
    const fetchPlants = async () => {
      updateSyncStatus('loading');
      // 植物とログを結合して取得
      const { data, error } = await supabase
        .from('plants')
        .select(`*, logs(*)`); // logsテーブルも一緒に取得
      
      if (error) {
        console.error(error);
        // alert('Data Fetch Error'); // 初回などエラーが出る場合があるので一旦サイレントに
      } else {
        // ローカル用にデータを整形 (Supabaseのlogsは配列で来る)
        plants = data.map(p => ({
          db_id: p.id, // UUID
          id: p.plant_id, // 表示用ID (A-01)
          image: p.image_url,
          logs: p.logs.map(l => ({
            type: l.type,
            ts: new Date(l.logged_at).getTime()
          }))
        }));
        render();
      }
      updateSyncStatus('online');
    };

    // 植物追加
    const addPlantToDB = async (plantId, initialImageBlob = null) => {
      updateSyncStatus('loading');
      
      let imageUrl = null;
      if (initialImageBlob) {
        imageUrl = await uploadImage(initialImageBlob);
      }

      const { data, error } = await supabase
        .from('plants')
        .insert({ user_id: currentUser.id, plant_id: plantId, image_url: imageUrl })
        .select()
        .single();

      if (error) {
        alert("Error adding plant: " + error.message);
      } else {
        // リスト再取得して更新
        await fetchPlants();
      }
    };

    // ログ追加
    window.addLog = async (plantId, type) => {
      const plant = plants.find(p => p.id === plantId);
      if (!plant) return;
      
      updateSyncStatus('loading');
      const { error } = await supabase
        .from('logs')
        .insert({ 
          user_id: currentUser.id, 
          plant_db_id: plant.db_id, // UUIDを使用
          type: type 
        });
      
      if (error) console.error(error);
      await fetchPlants();
    };

    // 削除
    window.deletePlant = async (plantId) => {
      if(!confirm(`Delete ${plantId}?`)) return;
      const plant = plants.find(p => p.id === plantId);
      if (!plant) return;

      updateSyncStatus('loading');
      const { error } = await supabase.from('plants').delete().eq('id', plant.db_id);
      if(error) alert("Delete failed");
      else await fetchPlants();
    };

    // 画像アップロード
    const uploadImage = async (blob) => {
      const fileName = `${currentUser.id}/${Date.now()}.jpg`;
      const { data, error } = await supabase.storage
        .from('plant-images')
        .upload(fileName, blob, { upsert: true });
      
      if (error) {
        console.error('Upload error', error);
        return null;
      }
      
      const { data: { publicUrl } } = supabase.storage.from('plant-images').getPublicUrl(fileName);
      return publicUrl;
    };

    // 画像変更
    const elsImageInput = document.getElementById('imageFileInput');
    window.openImageUpload = (plantId) => {
      currentImageTargetPlantId = plantId;
      elsImageInput.click();
    };
    elsImageInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !currentImageTargetPlantId) return;
      
      const plant = plants.find(p => p.id === currentImageTargetPlantId);
      if (!plant) return;

      updateSyncStatus('loading');
      // 圧縮してUpload
      const compressedBlob = await compressImageToBlob(file);
      const publicUrl = await uploadImage(compressedBlob);
      
      if (publicUrl) {
        await supabase.from('plants').update({ image_url: publicUrl }).eq('id', plant.db_id);
        await fetchPlants();
      }
      e.target.value = '';
    });

    // ========================================
    // データ移行 (JSON Import)
    // ========================================
    document.getElementById('importBtn').addEventListener('click', () => els.importFileInput.click());
    
    els.importFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if(!confirm("手元のバックアップファイルをクラウドにアップロードしますか？\n(重複するIDはスキップされます)")) return;

      updateSyncStatus('loading');
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const localData = JSON.parse(ev.target.result);
          if (!Array.isArray(localData)) throw new Error("Invalid Format");

          let count = 0;
          for (const item of localData) {
            // ID重複チェック
            const exists = plants.find(p => p.id === item.id);
            if (!exists) {
              // 1. 植物登録
              const { data: newPlant, error } = await supabase
                .from('plants')
                .insert({ user_id: currentUser.id, plant_id: item.id })
                .select()
                .single();
              
              if (!error && newPlant && item.logs) {
                // 2. ログ登録
                const logsToInsert = item.logs.map(l => ({
                  user_id: currentUser.id,
                  plant_db_id: newPlant.id,
                  type: l.type,
                  logged_at: new Date(l.ts).toISOString()
                }));
                if (logsToInsert.length > 0) {
                  await supabase.from('logs').insert(logsToInsert);
                }
                count++;
              }
            }
          }
          alert(`Import complete! Added ${count} plants.`);
          await fetchPlants();
          closeSettingsModal();
        } catch (err) {
          alert("Import Failed: " + err.message);
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    // ========================================
    // ユーティリティ
    // ========================================
    const compressImageToBlob = (file) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const maxWidth = 600; // Cloud版は少し高画質に
            const scale = maxWidth / img.width;
            const w = scale < 1 ? maxWidth : img.width;
            const h = scale < 1 ? img.height * scale : img.height;
            canvas.width = w; canvas.height = h;
            ctx.drawImage(img, 0, 0, w, h);
            canvas.toBlob(resolve, 'image/jpeg', 0.7);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    };
    
    // 日付フォーマット
    const formatDate = (ts) => {
      const d = new Date(ts);
      return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
    };
    
    // 平均日数計算
    const calculateAverageInterval = (plant) => {
      const targetTypes = ['水', '液肥', '活力剤'];
      const validLogs = plant.logs.filter(l => targetTypes.includes(l.type));
      if (validLogs.length < 2) return null;
      const sorted = [...validLogs].sort((a, b) => b.ts - a.ts);
      let total = 0, count = 0;
      for (let i = 0; i < sorted.length - 1; i++) {
        const diff = (sorted[i].ts - sorted[i+1].ts) / (1000 * 60 * 60 * 24);
        if (diff >= 0.5) { total += diff; count++; }
      }
      return count > 0 ? Math.round(total / count) : null;
    };

    // ========================================
    // UI操作系 (モーダルなど)
    // ========================================
    document.getElementById('settingsBtn').addEventListener('click', () => els.settingsModal.classList.remove('hidden'));
    window.closeSettingsModal = (e) => { if(!e || e.target === els.settingsModal) els.settingsModal.classList.add('hidden'); };

    els.fabBtn.addEventListener('click', () => { els.actionSheetOverlay.classList.remove('hidden'); els.actionSheet.classList.remove('hidden'); });
    window.closeActionSheet = () => { els.actionSheetOverlay.classList.add('hidden'); els.actionSheet.classList.add('hidden'); };

    document.getElementById('manualOptionBtn').addEventListener('click', () => { closeActionSheet(); els.manualInputModal.classList.remove('hidden'); els.manualIdInput.focus(); });
    window.closeManualModal = (e) => { if(!e || e.target === els.manualInputModal) els.manualInputModal.classList.add('hidden'); };
    
    document.getElementById('manualSubmitBtn').addEventListener('click', async () => {
      const id = els.manualIdInput.value.trim();
      if (!id) return;
      const exists = plants.find(p => p.id === id);
      if (exists) { alert('Already exists'); return; }
      closeManualModal();
      await addPlantToDB(id);
    });

    // ========================================
    // カメラ・スキャン
    // ========================================
    document.getElementById('cameraOptionBtn').addEventListener('click', () => { closeActionSheet(); els.scanOverlay.classList.remove('hidden'); startCamera(); });
    document.getElementById('closeScanBtn').addEventListener('click', () => { els.scanOverlay.classList.add('hidden'); stopCamera(); });
    document.getElementById('captureBtn').addEventListener('click', async () => {
      const ctx = els.canvas.getContext('2d');
      els.canvas.width = els.video.videoWidth; els.canvas.height = els.video.videoHeight;
      ctx.drawImage(els.video, 0, 0);
      els.scanStatus.textContent = "Analyzing...";
      
      const blob = await new Promise(r => els.canvas.toBlob(r, 'image/jpeg', 0.8));
      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = reader.result; // AIにはBase64を送る
        // API呼び出し (変更なし)
        try {
          const res = await fetch('/api/scan-image', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ imageBase64: base64 }) });
          const result = await res.json();
          if (result.id && result.id !== 'NOT_FOUND') {
            const exists = plants.find(p => p.id === result.id);
            if (exists) {
              alert(`Found: ${result.id}`);
              stopCamera(); els.scanOverlay.classList.add('hidden');
            } else {
              if (confirm(`New Plant: ${result.id}\nRegister?`)) {
                stopCamera(); els.scanOverlay.classList.add('hidden');
                await addPlantToDB(result.id, blob); // 画像もUpload
              }
            }
          } else {
            els.scanStatus.textContent = "Not recognized";
          }
        } catch(e) { console.error(e); els.scanStatus.textContent = "Error"; }
      };
      reader.readAsDataURL(blob);
    });
    
    const startCamera = async () => {
      try { cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); els.video.srcObject = cameraStream; } catch(e){}
    };
    const stopCamera = () => { if(cameraStream) cameraStream.getTracks().forEach(t=>t.stop()); };

    // ========================================
    // 描画 (Render)
    // ========================================
    window.toggleAccordion = (id) => {
      const content = document.getElementById(`acc-content-${id}`);
      const arrow = document.getElementById(`acc-arrow-${id}`);
      content.classList.toggle('expanded');
      arrow.classList.toggle('rotated');
    };

    const render = () => {
      let data = plants;
      if (searchQuery) data = data.filter(p => p.id.toLowerCase().includes(searchQuery.toLowerCase()));
      
      const sortType = els.sortSelect.value;
      if (sortType === 'id') data.sort((a,b)=>a.id.localeCompare(b.id));
      else if (sortType === 'alert') data.sort((a,b)=>{ /* 省略:Alertロジック */ return 0; }); // 必要に応じて実装
      else if (sortType === 'dry_slow') data.sort((a,b)=>(calculateAverageInterval(b)||0)-(calculateAverageInterval(a)||0));
      else if (sortType === 'dry_fast') data.sort((a,b)=>(calculateAverageInterval(a)||999)-(calculateAverageInterval(b)||999));

      els.plantList.innerHTML = '';
      if (data.length === 0) {
        els.plantList.innerHTML = `<div class="text-center py-20 text-gray-500"><div class="text-6xl mb-4 opacity-20">🌱</div>No Data</div>`;
        return;
      }

      data.forEach(p => {
        const avg = calculateAverageInterval(p);
        const lastLog = p.logs[0];
        const lastDate = lastLog ? formatDate(lastLog.ts) : '---';
        const isAlert = false; // 必要に応じてロジック復活

        const card = document.createElement('div');
        card.className = `bg-gray-800 border ${isAlert ? 'border-red-900 bg-red-900/10' : 'border-gray-700'} rounded-xl overflow-hidden shadow-lg relative`;
        
        // バッジ
        let badge = '';
        if (sortType.includes('dry') && avg) badge = `<div class="absolute top-4 right-12 bg-gray-700 text-teal-400 text-[10px] px-2 py-1 rounded border border-gray-600 font-bold">AVG ${avg}d</div>`;

        // ログリストHTML
        const logsHtml = p.logs.slice(0,5).map(l => `
          <div class="flex justify-between py-2 border-b border-gray-700 text-sm">
            <span class="text-gray-500 font-mono text-xs">${formatDate(l.ts)}</span>
            <span class="text-gray-300 bg-gray-700 px-2 rounded text-xs border border-gray-600">${l.type}</span>
          </div>`).join('');

        card.innerHTML = `
          ${badge}
          <div class="p-4 flex items-center justify-between cursor-pointer hover:bg-white/5 transition" onclick="toggleAccordion('${p.id}')">
            <div class="flex items-center gap-4">
              <div class="text-2xl">${isAlert?'⚠️':'🌿'}</div>
              <div>
                <div class="font-bold text-lg text-gray-100">${p.id}</div>
                <div class="text-xs text-gray-500">Last: <span class="text-gray-300">${lastDate}</span></div>
              </div>
            </div>
            <div id="acc-arrow-${p.id}" class="arrow-icon text-gray-500 transition-transform">▼</div>
          </div>
          <div id="acc-content-${p.id}" class="accordion-content bg-gray-900/50 shadow-inner">
            <div class="p-4 border-t border-gray-700 space-y-4">
              <div onclick="openImageUpload('${p.id}')" class="w-full h-48 bg-gray-800 rounded-lg overflow-hidden border border-gray-700 relative group cursor-pointer">
                ${p.image ? `<img src="${p.image}" class="w-full h-full object-cover">` : `<div class="flex items-center justify-center h-full text-gray-600 text-xs">No Photo</div>`}
                <div class="absolute inset-0 bg-black/40 hidden group-hover:flex items-center justify-center text-white text-xs font-bold">Change</div>
              </div>
              <div class="space-y-1">
                <div class="flex justify-between text-xs text-gray-500"><span>History</span><span>Avg: ${avg?avg+'d':'---'}</span></div>
                <div class="bg-gray-800/50 rounded px-2">${logsHtml||'<div class="p-2 text-center text-xs text-gray-600">No logs</div>'}</div>
              </div>
              <div class="grid grid-cols-3 gap-2">
                <button onclick="addLog('${p.id}','液肥')" class="bg-gray-800 border border-green-900 text-green-400 py-2 rounded text-xs font-bold shadow hover:bg-gray-700">液肥</button>
                <button onclick="addLog('${p.id}','水')" class="bg-teal-600 text-white py-2 rounded text-xs font-bold shadow hover:bg-teal-500">水やり</button>
                <button onclick="addLog('${p.id}','活力剤')" class="bg-gray-800 border border-yellow-900 text-yellow-400 py-2 rounded text-xs font-bold shadow hover:bg-gray-700">活力剤</button>
              </div>
              <div class="text-right"><button onclick="deletePlant('${p.id}')" class="text-xs text-gray-600 underline hover:text-red-400">Delete</button></div>
            </div>
          </div>
        `;
        els.plantList.appendChild(card);
      });
    };
    els.searchInput.addEventListener('input', (e)=>{ searchQuery=e.target.value; render(); });
    els.sortSelect.addEventListener('change', render);

    // 開始
    checkUser();
  </script>
</body>
</html>
